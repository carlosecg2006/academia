<style>
/* Layout: app de uma coluna para o celular; cabeçalho com relógio de saída, conteúdo em cartões, barra de abas fixa embaixo */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --ink:#13201b; --muted:#56655f; --line:#cfd8d4;
  --accent:#0b6e52; --accent-ink:#ffffff; --accent-soft:#d6ece3;
  --warn:#a85a00; --warn-soft:#fbead2; --danger:#b42318; --danger-soft:#fbe0dd; --ok:#13795b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1311; --surface:#151f1b; --sunk:#1c2924; --ink:#e7efeb; --muted:#9caca5; --line:#2a3833;
  --accent:#3cc596; --accent-ink:#04140e; --accent-soft:#163a2e;
  --warn:#f2a33a; --warn-soft:#3a2a12; --danger:#ff7b6e; --danger-soft:#3d1916; --ok:#4fd1a1; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1311; --surface:#151f1b; --sunk:#1c2924; --ink:#e7efeb; --muted:#9caca5; --line:#2a3833;
  --accent:#3cc596; --accent-ink:#04140e; --accent-soft:#163a2e;
  --warn:#f2a33a; --warn-soft:#3a2a12; --danger:#ff7b6e; --danger-soft:#3d1916; --ok:#4fd1a1; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.clock{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.leave{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.leave b{color:var(--ink)}
.leave.warn b,.leave.warn{color:var(--warn)}
.leave.danger b,.leave.danger{color:var(--danger)}
.sos{border:2px solid var(--danger);color:var(--danger);background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:700;color:var(--muted)}
.big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;text-transform:uppercase}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:14px 18px;font-weight:700;font-size:17px;cursor:pointer;background:var(--sunk);color:var(--ink);min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;min-height:38px}
.btn.wide{width:100%}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:14px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.note b{color:var(--warn)}
.danger-note{background:var(--danger-soft);border-radius:10px;padding:10px 12px;font-size:14px}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
/* exercício */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex.done{border-color:var(--ok)}
.ex-head{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.ex-num{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--muted);min-width:24px;font-variant-numeric:tabular-nums}
.ex-main{flex:1;min-width:0}
.ex-name{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.1}
.ex-sub{font-size:14px;color:var(--muted)}
.ex-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:48px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:20px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.set.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],select,textarea{font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
details.guide{border-top:1px solid var(--line);padding-top:10px}
details.guide summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none;padding:4px 0}
details.guide summary::-webkit-details-marker{display:none}
.gsec{margin-top:10px}
.gsec h4{margin:0 0 4px;font-family:var(--f-display);font-size:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.timer-in{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer-in .t{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.timer-in button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 10px;font-weight:700;font-size:14px;cursor:pointer}
.timer-in.end{background:var(--accent);color:var(--accent-ink)}
/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;height:64px;text-decoration:none;color:var(--muted);font-weight:700;font-size:13px;gap:2px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:24px;height:24px;margin:0;accent-color:var(--accent);flex:none}
.timeline{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-variant-numeric:tabular-nums}
.timeline .h{font-family:var(--f-display);font-weight:700;font-size:18px}
.sess-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sess-list button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1}
.sess-list button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.modal-in{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:14px}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
@media (prefers-reduced-motion:no-preference){.set{transition:background .12s,border-color .12s}}
@media (max-width:380px){.fields{grid-template-columns:1fr}.big{font-size:34px}}
</style>

  <header class="top">

</div>

<script>
"use strict";
/* ============ DADOS DO TREINO (ficha ORIGINAL do amigo; guias resumidos) ============ */
const SESS = {
  A:{nome:"Peitoral", curto:"Peito"},
  B:{nome:"Costas", curto:"Costas"},
  C:{nome:"Quadríceps + panturrilha", curto:"Pernas"},
  D:{nome:"Ombros + trapézio", curto:"Ombros"},
  E:{nome:"Braço + antebraço", curto:"Braço"},
  F:{nome:"Glúteo + posterior + abdominal", curto:"Glúteo/abd."}
};
const ORDER = ["A","B","C","D","E","F"];
/* séries por semana do plano (índice 0 = semana 1 … 6 = semana 7) */
const T = {
  p6:[[2,2,2,2,2,2],[3,3,2,2,2,2],[3,3,3,3,2,2],[3,3,3,3,3,3],[4,4,3,3,3,3],[4,4,4,4,3,3],[4,4,4,4,4,4]],
  q3:[[4,4,4],[5,5,4],[6,5,5],[6,6,6],[7,7,6],[8,7,7],[8,8,8]],
  t3:[[2,2,2],[3,2,2],[3,3,2],[3,3,3],[4,3,3],[4,4,3],[4,4,4]],
  lat:[6,7,8,9,10,11,12],
  b6:[3,4,4,4,5,5,6]
};
const SPIN = {id:"SP", n:"Spinning", pt:"Bike de spinning", pat:"sp", spin:true,
  proc:"Bicicleta fixa com roda pesada na frente e botão de carga.",
  prep:["Banco na altura do osso do quadril (em pé ao lado da bike).","Sentado, com o pedal embaixo, o joelho fica levemente dobrado.","Pergunte na academia como frear a roda."],
  exec:["Sugestão até seu amigo confirmar: 5 a 10 min leve, num ritmo em que dá para conversar.","Nos últimos 1–2 min, diminua.","Para parar: aumente a carga ou aperte o freio e só tire os pés com os pedais parados."],
  sente:"Respiração mais rápida, mas controlada.",
  erros:["Quadril rebolando no banco → banco alto.","Sem carga nenhuma → a roda gira sozinha e puxa o pé."],
  aviso:"Sem tempo? Pule e saia no horário. O Spinning não vira pendência."};
const EX = [
 /* ---------- A PEITORAL ---------- */
 {id:"A1",s:"A",n:"Incline Chest Press (Machine)",pt:"Supino inclinado na máquina",pat:"p6",pi:0,
  proc:"Máquina sentada com encosto inclinado para trás. Você empurra os pegadores para a frente e para cima.",
  prep:["Carga mais leve.","Assento: os punhos ficam na altura da parte de CIMA do peito, não do ombro.","Costas e cabeça encostadas, pés firmes no chão.","Cotovelos a uns 45° do corpo: nem colados, nem abertos em T.","Antes de empurrar: ombros para trás e para baixo."],
  exec:["Empurre em 1–2 s até quase esticar, sem travar o cotovelo.","Volte devagar, em 2–3 s, até o peito alongar de leve.","Não deixe as placas baterem."],
  sente:"Parte de cima do peito (ombro e tríceps ajudam).",
  erros:["Sente mais o ombro → suba o assento e desça os ombros.","Costas descolando → carga alta demais."]},
 {id:"A2",s:"A",n:"Low Cable Fly Crossovers",pt:"Crossover polia baixa (de baixo para cima)",pat:"p6",pi:1,prof:1,
  proc:"Crossover: estrutura com 2 torres de cabo, uma de cada lado. Use as roldanas lá embaixo e 2 alças.",
  prep:["As duas roldanas no ponto mais BAIXO, na mesma altura (conte os furos).","Uma alça em cada cabo, carga leve e igual.","Pegue as alças dobrando os joelhos e dê 1 passo à frente das torres.","Pés paralelos, tronco um pouco inclinado à frente, barriga firme.","Cotovelo levemente dobrado e FIXO, como quem abraça uma árvore."],
  exec:["Traga as mãos de baixo para cima em arco, como quem levanta uma bandeja.","As mãos se encontram na altura da parte de cima do peito, cruzando de leve.","Aperte 1 s e volte devagar pelo mesmo arco."],
  sente:"Parte de cima do peito.",
  erros:["Sente só o ombro → não suba as mãos acima do queixo.","Dobra e estica o cotovelo → mantenha o ângulo fixo."]},
 {id:"A3",s:"A",n:"Chest Press (Machine)",pt:"Supino reto na máquina",pat:"p6",pi:2,
  proc:"Máquina sentada com encosto reto (em pé). Você empurra os pegadores reto para a frente.",
  prep:["Carga mais leve.","Assento: pegadores na altura do MEIO do peito (linha dos mamilos).","Costas encostadas, bumbum no fundo, pés firmes.","Cotovelos a ~45°, ombros para trás e para baixo."],
  exec:["Empurre reto em 1–2 s, sem travar o cotovelo.","Volte devagar em 2–3 s.","Sem bater as placas."],
  sente:"Meio do peito.",
  erros:["Ombros subindo → menos carga.","Cotovelos abertos em T → feche um pouco."]},
 {id:"A4",s:"A",n:"Crucifixo Polia Média",pt:"Crossover na altura do peito",pat:"p6",pi:3,prof:1,
  proc:"Crossover (2 torres de cabo) com as roldanas na altura do seu mamilo e 2 alças.",
  aviso:"O nome diz \"máquina\", mas o texto do seu amigo fala de polias. Confirme com ele.",
  prep:["Roldanas na altura do MAMILO, iguais dos dois lados.","Alças e carga leve.","1 passo à frente das torres, pés paralelos, tronco EM PÉ.","Braços abertos para os lados, cotovelo levemente dobrado e fixo."],
  exec:["Feche os braços na horizontal, como um abraço numa árvore grossa.","As mãos se encontram na frente do peito. Aperte 1 s.","Abra devagar, sem passar da linha dos ombros."],
  sente:"Meio do peito.",
  erros:["Ombros indo para a frente no fim → pare quando as mãos se encontrarem.","Mãos subindo ou descendo → o caminho é reto, na horizontal."]},
 {id:"A5",s:"A",n:"Decline Bench Press (Machine)",pt:"Supino declinado na máquina",pat:"p6",pi:4,prof:1,
  proc:"Máquina de empurrar em que o caminho vai para a frente e um pouco para baixo. Os modelos variam: leia o adesivo.",
  prep:["Carga mais leve.","Assento: punhos alinhados à parte de BAIXO do peito.","Costas encostadas; se houver rolo para as coxas, encaixe.","Cotovelos a ~45°, ombros para baixo."],
  exec:["Empurre seguindo o caminho da máquina, sem travar o cotovelo.","Volte devagar."],
  sente:"Parte de baixo do peito.",
  erros:["Ombros subindo ou costas descolando → menos carga."]},
 {id:"A6",s:"A",n:"Cable Fly Crossovers",pt:"Crossover polia alta (de cima para baixo)",pat:"p6",pi:5,prof:1,hip:"5–12",
  proc:"Crossover com as roldanas no ponto MAIS ALTO e 2 alças.",
  prep:["Duas roldanas no topo, iguais.","Alças e carga leve.","1 passo à frente das torres, pés paralelos, tronco levemente inclinado.","Cotovelo levemente dobrado e fixo."],
  exec:["Traga as mãos de cima para baixo em arco.","As mãos se encontram na frente do umbigo. Aperte 1 s.","Volte devagar."],
  sente:"Parte de baixo e do meio do peito.",
  erros:["Tronco balançando → menos carga.","Cotovelo dobrando e esticando → ângulo fixo."]},
 /* ---------- B COSTAS ---------- */
 {id:"B1",s:"B",n:"Lat Pulldown (Cable)",pt:"Puxada alta / puxada frente",pat:"p6",pi:0,hip:"10–12",
  proc:"Banco com rolos sobre as coxas e uma barra comprida lá em cima, presa a um cabo.",
  prep:["Rolos (joelheira) firmes em cima das coxas.","Pegada com as palmas para a frente, mãos um pouco mais abertas que os ombros.","Sente-se com a barra nas mãos e incline o tronco só um pouco para trás.","ANTES de dobrar o braço: desça os ombros, longe das orelhas."],
  exec:["Puxe levando os cotovelos para baixo e para trás, como se quisesse pôr o cotovelo no bolso.","A barra desce até a parte de cima do peito, passando pela frente do rosto.","Volte devagar até esticar os braços."],
  sente:"Laterais das costas, abaixo da axila.",
  erros:["Sente só o braço → pense em cotovelo no bolso e deixe a mão como gancho.","Balança o tronco → menos carga.","Nunca solte a barra lá embaixo."]},
 {id:"B2",s:"B",n:"Iso-Lateral High Row (Machine)",pt:"Remada alta articulada",pat:"p6",pi:1,prof:1,
  proc:"Máquina com braços móveis independentes. Os pegadores ficam acima e à frente da cabeça, em diagonal.",
  aviso:"A torção do tronco só faz sentido com um braço por vez. Até confirmar com seu amigo, alterne os braços.",
  prep:["Carga leve e igual dos dois lados (pergunte quanto pesa o braço vazio).","Assento: os braços começam esticados em DIAGONAL para cima.","Pegada com a palma virada para você (supinada).","Peito apoiado, ombros para trás e para baixo."],
  exec:["Puxe o cotovelo para baixo e para trás, rente ao corpo.","No fim, uma torção pequena do tronco para o lado que puxa. Aperte 1 s.","Volte devagar."],
  sente:"Lateral das costas, do lado que puxa.",
  erros:["Jogar o tronco para trás → menos carga.","Puxando na horizontal → assento alto demais."]},
 {id:"B3",s:"B",n:"Remada Unilateral Na Polia",pt:"Remada baixa com um braço",pat:"p6",pi:2,lado:1,hip:"12",
  proc:"Estação de remada baixa: banco comprido, plataforma para os pés e cabo saindo embaixo. Use 1 alça.",
  prep:["Uma alça no cabo, carga leve.","Sentado de frente para a polia, pés na plataforma, joelhos levemente dobrados.","Pegue a alça dobrando o quadril (não as costas) e volte com a coluna ereta."],
  exec:["Puxe o cotovelo para trás, rente ao corpo, como uma cotovelada para trás.","No fim: inclinação pequena para trás e torção leve. Aperte 1 s.","Volte devagar. Faça um lado inteiro e depois o outro."],
  sente:"Lateral e meio das costas.",
  erros:["Deitar o tronco para trás → menos carga.","Costas curvadas com o braço esticado → dobre o quadril, não a coluna."]},

/* ============ REGRAS DO PLANO ============ */
function phase(week){
  if(week<=7) return {k:"read", label:"Readaptação · semana "+week, wi:week-1};
  if(week===8) return {k:"deload", label:"Semana 8 · Deload", wi:0};
  const c=(week-9)%5;
  return [{k:"hip",label:"Hipertrofia",wi:6},{k:"forca",label:"Força",wi:0},{k:"hip",label:"Hipertrofia",wi:6},{k:"forca",label:"Força",wi:0},{k:"deload",label:"Deload",wi:0}][c];
}
function setsFor(ex, week){
  const wi = phase(week).wi;
  switch(ex.pat){
    case "p6": return T.p6[wi][ex.pi];
    case "q3": return T.q3[wi][ex.pi];
    case "t3": return T.t3[wi][ex.pi];
    case "lat": return T.lat[wi];
    case "b6": return T.b6[wi];
    case "c3": return 3;
    default: return 1;
  }
}
function repsHint(ex, week){
  if(ex.spin) return "5–10 min leve (sugestão)";
  const ph=phase(week);
  if(ph.k==="hip") return ex.hip ? ex.hip+" reps (ficha original)" : "reps não informadas na ficha";
  if(week>=5 && week<=7) return (ex.hip ? "aproximar de "+ex.hip : "10–12")+" reps · sobrar 2–3";
  return (ex.dl ? "8–10" : "10–15")+" reps · sobrar 3–4";
}

async function flush(){

/* ============ TREINO ============ */
function buildWorkout(){
  const sess=S.next; const items=[]; const dropped=[];
  // pendências de outro grupo vêm primeiro; as do mesmo grupo encerram (rodada encerrada)
  const late=[];
  for(const p of S.pend){
    const ex=BYID[p.id];
    if(ex.s===sess){ dropped.push({id:p.id,sets:p.sets,reason:"rodada encerrada"}); continue; }
    const it={id:p.id, target:p.sets, done:0, load:(S.loads[p.id]||{}).load||"", rir:"", pend:true, since:p.since};
    if(ex.dl && sess==="C"){ it.late=true; late.push(it); } else items.push(it);
  }
  for(const ex of EX.filter(e=>e.s===sess)){
    items.push({id:ex.id, target:setsFor(ex,S.week), done:0, load:(S.loads[ex.id]||{}).load||"", rir:""});
  }
  items.push(...late);
  items.push({id:"SP", target:1, done:0, load:"", rir:""});
  S.current={date:todayKey(), sess, week:S.week, items, startedAt:Date.now(), dropped};
  S.pend=[];
  save();
}
function finishWorkout(reasonDefault){
  const c=S.current; if(!c) return;
  const newPend=[]; const rec={date:c.date, sess:c.sess, week:c.week, items:[], dropped:c.dropped||[]};
  for(const it of c.items){
    const ex=BYID[it.id];
    if(it.load) S.loads[it.id]=Object.assign({},S.loads[it.id],{load:it.load});
    let status="ok", reason="";
    if(it.done<it.target){
      if(ex.spin){ status="no"; reason="tempo"; }
      else if(ex.prof===2 && !S.released[it.id] && it.done===0){ status="no"; reason="ainda aprendendo"; }
      else { status=it.done>0?"part":"pend"; reason=it.reason||reasonDefault; newPend.push({id:it.id, sets:it.target-it.done, reason, since:it.since||c.date}); }
    }
    rec.items.push({id:it.id, done:it.done, target:it.target, load:it.load, rir:it.rir, status, reason, pend:!!it.pend});
  }
  S.history.unshift(rec); if(S.history.length>150) S.history.length=150;
  S.pend=newPend;
  const idx=ORDER.indexOf(c.sess);
  S.next=ORDER[(idx+1)%6];
  if(c.sess==="F") S.awaitingReady=true;
  S.current=null;
  save();
}

  const a=b.dataset.act;
  if(a==="start"){ buildWorkout(); window.scrollTo(0,0); route(); keepAwake(); }
  else if(a==="set"){ const it=S.current.items[+b.dataset.i]; const k=+b.dataset.k; const was=it.done; it.done = (k<it.done)?k:k+1; save(); rerenderKeep(); if(it.done>was && !BYID[it.id].spin){ const ex=BYID[it.id]; startTimer(ex.pat==="p6"||ex.pat==="q3"||ex.dl||ex.id==="D2"||ex.id==="F1"?120:75);} }
  else if(a==="later"){ const i=+b.dataset.i; const [it]=S.current.items.splice(i,1); const spinIdx=S.current.items.findIndex(x=>x.id==="SP"); S.current.items.splice(spinIdx<0?S.current.items.length:spinIdx,0,it); save(); rerenderKeep(); }
  else if(a==="rest"){ startTimer(+b.dataset.s); }
  else if(a==="release"){ S.released[b.dataset.id]=true; save(); rerenderKeep(); }
  else if(a==="finish"){ finishModal(); }
  else if(a==="confirmFinish"){ const w=document.getElementById("why"); finishWorkout(w?w.value:"tempo"); closeModal(); stopTimer(); location.hash="#hoje"; route(); window.scrollTo(0,0); }
  else if(a==="close"){ closeModal(); }
  else if(a==="ready"){ readyModal(); }
  else if(a==="readyGo"){ const all=[...document.querySelectorAll(".rq")].every(x=>x.checked); if(all && S.week<18) S.week++; S.rodada++; S.awaitingReady=false; save(); closeModal(); route(); }
  else if(a==="gsess"){ guideSess=b.dataset.s; route(); window.scrollTo(0,0); }
});
document.addEventListener("change",e=>{
  const t=e.target; const a=t.dataset&&t.dataset.act;
  if(a==="rir"){ S.current.items[+t.dataset.i].rir=t.value; save(); }
  else if(a==="check"){ S.checks.items[t.dataset.k]=t.checked; save(); }
  else if(a==="setnext"){ S.next=t.value; save(); }
  else if(a==="setweek"){ S.week=+t.value; save(); }
});
document.addEventListener("input",e=>{
  const t=e.target; if(t.dataset&&t.dataset.act==="load"){ S.current.items[+t.dataset.i].load=t.value; save(); }
});
document.getElementById("sosBtn").addEventListener("click",sosModal);
window.addEventListener("hashchange",()=>{ route(); window.scrollTo(0,0); });

/* ============ RELÓGIO / SAÍDA ============ */
function tick(){
  const d=new Date(); const m=d.getHours()*60+d.getMinutes();
  document.getElementById("clock").textContent=pad(d.getHours())+":"+pad(d.getMinutes());
  const el=document.getElementById("leave"); el.className="leave";
  const lim=7*60+15;
  if(m>=4*60 && m<lim){
    const left=lim-m;
    if(m>=7*60+5){ el.classList.add("danger"); el.innerHTML=`<b>Encerre agora:</b> sair em ${left} min`; }
    else if(m>=6*60+50){ el.classList.add("warn"); el.innerHTML=`Sair às <b>7h15</b> · faltam ${left} min`; }
    else el.innerHTML=`Sair da academia às <b>7h15</b> · faltam ${Math.floor(left/60)}h${pad(left%60)}`;
  } else if(m>=lim && m<8*60){ el.classList.add("danger"); el.innerHTML="<b>SAIR AGORA:</b> remédio às 8h"; }
  else el.innerHTML="Sair da academia até <b>7h15</b>";
}
tick(); setInterval(tick,15000);

/* ============ CRONÔMETRO ============ */
let tEnd=0, tInt=null, actx=null;
const timerEl=document.getElementById("timer"), timerIn=document.getElementById("timerIn"), timerT=document.getElementById("timerT");
function startTimer(sec){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  tEnd=Date.now()+sec*1000; timerEl.hidden=false; timerIn.classList.remove("end");
  clearInterval(tInt); tInt=setInterval(tTick,250); tTick();
}
function tTick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  timerT.textContent=Math.floor(left/60)+":"+pad(left%60);
  if(left===0){ clearInterval(tInt); timerIn.classList.add("end"); timerT.textContent="Bora!"; beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){} }
}
function beep(){ if(!actx) return; try{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.2,actx.currentTime); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6); o.start(); o.stop(actx.currentTime+.6);}catch(e){} }
function stopTimer(){ clearInterval(tInt); timerEl.hidden=true; }
document.getElementById("timerPlus").addEventListener("click",()=>{ tEnd=Math.max(tEnd,Date.now())+30000; timerIn.classList.remove("end"); clearInterval(tInt); tInt=setInterval(tTick,250); tTick(); });
document.getElementById("timerStop").addEventListener("click",stopTimer);

/* tela acesa durante o treino */
let wl=null;
async function keepAwake(){ try{ if(navigator.wakeLock && !wl){ wl=await navigator.wakeLock.request("screen"); wl.addEventListener("release",()=>{wl=null}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.current) keepAwake(); });

/* ============ INÍCIO ============ */
route();
(async()=>{
  if(!window.claude||!window.claude.use){ setSync("Salvo neste celular."); return; }
  try{
    db = await window.claude.use("db");
    if(!db){ setSync("Salvo neste celular."); return; }
    docRef = db.doc("treino/estado");
    const timer=setTimeout(()=>setSync("Nuvem demorando; salvando neste celular."),10000);
    const snap = await docRef.get(); clearTimeout(timer);
    if(snap.exists){
      const remote=snap.data();
      if(remote && remote.v===1 && (remote.updatedAt||0) > (S.updatedAt||0)){ S=Object.assign(fresh(),JSON.parse(JSON.stringify(remote))); localSave(); rerenderKeep(); }
      else if((S.updatedAt||0) > (remote.updatedAt||0)){ dirty=true; flush(); }
      setSync("Sincronizado com a nuvem ✓");
    } else {
      if(S.updatedAt){ dirty=true; flush(); } else setSync("Pronto. Seu progresso é salvo na nuvem.");
    }
  }catch(e){ setSync("Salvo neste celular."); }
})();
</script>
